name: Issue Comment

on:
  issues:
    types: [opened]

jobs:
  comment:
    runs-on: ubuntu-24.04 

    steps:
      - uses: actions/checkout@v4

      - name: Comment on issue
        run: gh issue comment "${{ github.event.issue.number }}" --body "👍 = accept"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}   
