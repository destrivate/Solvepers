name: Issue Accept

on:
  issue_comment:
    types: [created]

jobs:
  accept:
    if: github.event.comment.body == '/accept'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: read

    steps:
      - name: Check admin permission
        id: check
        run: |
          ROLE=$(gh api "repos/${GITHUB_REPOSITORY}/collaborators/${{ github.event.comment.user.login }}/permission" --jq '.permission' 2>/dev/null || echo "none")
          echo "result=$ROLE" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: actions/checkout@v4.2.2
        if: steps.check.outputs.result == 'admin'
        with:
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Create file in ideas
        if: steps.check.outputs.result == 'admin'
        run: |
          NUMBER="${{ github.event.issue.number }}"
          TITLE=$(gh issue view "$NUMBER" --json title --jq .title)
          BODY=$(gh issue view "$NUMBER" --json body --jq .body)
          SLUG=$(echo "$TITLE" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9' '-' | sed 's/---*/-/g' | sed 's/^-//' | sed 's/-$//')
          mkdir -p ideas
          echo "$BODY" > "ideas/${SLUG}.md"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@://github.com"
          git add "ideas/${SLUG}.md"
          git commit -m "Add idea: ${TITLE}"
          git push
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
