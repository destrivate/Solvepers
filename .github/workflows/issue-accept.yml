name: Issue Accept

on:
  issue_comment:
    types: [created]

jobs:
  accept:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: read

    steps:
      - name: Check trigger and admin
        id: check
        if: github.event.comment.body == '/accept'
        run: |
          PERM=$(gh api "repos/${GITHUB_REPOSITORY}/collaborators/${{ github.event.comment.user.login }}" --jq '.permission' 2>/dev/null || echo "none")
          echo "result=$PERM" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/checkout@v5
        if: steps.check.outputs.result == 'admin'

      - name: Create file from issue
        if: steps.check.outputs.result == 'admin'
        run: |
          NUMBER="${{ github.event.issue.number }}"
          TITLE=$(gh issue view "$NUMBER" --json title --jq .title)
          BODY=$(gh issue view "$NUMBER" --json body --jq .body)
          SLUG=$(echo "$TITLE" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9' '-' | sed 's/---*/-/g' | sed 's/^-//' | sed 's/-$//')
          mkdir -p issues
          echo "$BODY" > "issues/${SLUG}.md"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "issues/${SLUG}.md"
          git commit -m "Add issue: ${TITLE}"
          git push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}   
