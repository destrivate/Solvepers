name: Issue Accept

on:
  reaction:
    types: [created]

jobs:
  accept:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: read

    if: |
      github.event.action == 'created' &&
      github.event.subject_type == 'Issue' &&
      github.event.reaction.content == 'thumbsup' &&
      github.event.actor.login == github.repository_owner

    steps:
      - uses: actions/checkout@v5

      - name: Create file from issue
        run: |
          TITLE=$(gh issue view "${{ github.event.issue.number }}" --json title --jq .title)
          BODY=$(gh issue view "${{ github.event.issue.number }}" --json body --jq .body)
          SLUG=$(echo "$TITLE" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9' '-' | sed 's/---*/-/g' | sed 's/^-//' | sed 's/-$//')
          mkdir -p issues
          echo "$BODY" > "issues/${SLUG}.md"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "issues/${SLUG}.md"
          git commit -m "Add issue: ${TITLE}"
          git push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}   
