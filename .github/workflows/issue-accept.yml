name: Issue Accept

on:
  reaction:
    types: [created]

jobs:
  create-idea:
    if: github.event.reaction.content == '+1'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: read
    steps:
      - uses: actions/checkout@v4

      - name: Create idea file
        env:
          TITLE: ${{ github.event.issue.title }}
          BODY: ${{ github.event.issue.body }}
          NUMBER: ${{ github.event.issue.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IS_MAINTAINER=$(gh api "repos/${{ github.repository }}/collaborators/${{ github.event.reaction.actor.login }}" --jq '.permission' 2>/dev/null)
          if [ "$IS_MAINTAINER" != "write" ] && [ "$IS_MAINTAINER" != "admin" ]; then
            echo "Not a maintainer, skipping."
            exit 0
          fi

          LANG=$(echo "$TITLE" | grep -oP '\[\K[^\]]+' | tail -1)
          NAME=$(echo "$TITLE" | sed "s/\[${LANG}\]//g" | sed 's/ /_/g' | sed 's/[^a-zA-Zа-яА-ЯёЁ0-9_]//g')

          if [ -z "$LANG" ]; then
            FILE="ideas/${NAME}.md"
          else
            FILE="ideas/${NAME}_${LANG}.md"
          fi

          cat > "$FILE" <<EOF
          # ${TITLE}

          **Статус:** 🟡 Work
          **Issue:** #${NUMBER}

          ## Описание

          ${BODY}

          ## Критерии

          - [ ]
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          git commit -m "ideas: ${NAME} (from #${NUMBER})"
          git push   
